name: header-form-check
# 헤더 로고 겹침(7페이지 × 5폭) + 홈 소식 받기 시험 제출 (11/13 홈 v7)
on:
  workflow_dispatch:
    inputs:
      base: { description: 기본 주소, default: 'https://www.darimati.us' }
      preview: { description: 미리보기 테마 ID, required: false, default: '' }
      email: { description: 시험 제출 이메일(비우면 제출 안 함), required: false, default: '' }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: npm i -s playwright@1 >/dev/null 2>&1 && npx -y playwright install --with-deps chromium >/dev/null 2>&1
      - run: node tools/header-form-check.mjs "${{ inputs.base }}" "${{ inputs.preview }}" "${{ inputs.email }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: header-form, path: shots/ }
