# 라이브 페이지 한 장 실측 — 맥 IP 가 쇼피파이에 429 로 막혔을 때 깃허브 서버에서 대신 받아 본다 (2026-10-30 와소코 가격 확인)
# 실행: gh workflow run live-check.yml -f url=<주소> -f pattern='<grep 정규식>'
name: live-check
on:
  workflow_dispatch:
    inputs:
      url:
        description: 확인할 주소
        required: true
      pattern:
        description: 페이지에서 찾을 글자(grep -E)
        required: false
        default: 'fbq\('
      shots:
        description: 폰 390 화면 캡처(스크롤 위치별) + PC 1440 전체 한 장 → 실행 결과 「shots」 파일로 받기 (11/11)
        type: boolean
        default: false
      act:
        description: (캡처 전) 폰 화면에서 실행할 자바스크립트 — 누르기 시험용. 결과(return 값)를 로그에 출력 (11/16)
        required: false
        default: ''
      cart_attr:
        description: 브라우저로 열어 장바구니 속성(유입 등) 출력
        type: boolean
        default: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: fetch
        env:
          URL: ${{ inputs.url }}
          PAT: ${{ inputs.pattern }}
        run: |
          code=$(curl -sL -A "Mozilla/5.0" -o page.html -w '%{http_code}' "$URL")
          echo "HTTP $code"
          echo "fbq 개수: $(grep -o 'fbq(' page.html | wc -l)"
          echo "--- 찾은 것 ---"
          grep -oE "$PAT" page.html | head -20 || true
          [ "$code" = 200 ]
      - name: cart attributes (실제 브라우저)
        if: ${{ inputs.cart_attr }}
        env:
          URL: ${{ inputs.url }}
          ACT: ${{ inputs.act }}
        run: |
          npm i -s playwright@1 >/dev/null 2>&1 && npx -y playwright install chromium >/dev/null 2>&1
          node -e '
          const { chromium } = require("playwright");
          (async () => {
            const b = await chromium.launch(); const pg = await b.newPage();
            await pg.goto(process.env.URL, { waitUntil: "load" }); await pg.waitForTimeout(4000);
            const c = await pg.evaluate(() => fetch("/cart.js").then(r => r.json()));
            console.log("장바구니 속성:", JSON.stringify(c.attributes)); await b.close();
          })();'
      - name: product click event (상품 링크 누름 → DMProductClick, 11/16)
        if: ${{ inputs.cart_attr }}
        env:
          URL: ${{ inputs.url }}
        run: |
          # 픽셀 대신 기록용 fbq 를 먼저 깔고, 페이지 안 첫 상품 링크(고르기 카드 우선)를 눌러 나간 이벤트를 찍는다
          node -e '
          const { chromium } = require("playwright");
          (async () => {
            const b = await chromium.launch(); const pg = await b.newPage();
            await pg.addInitScript(() => { window.__ev = []; window.fbq = function () { window.__ev.push([].slice.call(arguments, 0, 3)); }; });
            await pg.goto(process.env.URL, { waitUntil: "load" }); await pg.waitForTimeout(3000);
            const r = await pg.evaluate(async () => {
              const a = document.querySelector("main a[href*=\"/products/\"]") || document.querySelector("a[href*=\"/products/\"]");
              if (!a) return "상품 링크 없음";
              a.addEventListener("click", e => e.preventDefault(), { once: true }); a.click();
              await new Promise(r => setTimeout(r, 1500));
              return window.__ev.filter(e => e[1] === "DMProductClick");
            });
            console.log("상품 클릭 이벤트:", JSON.stringify(r)); await b.close();
          })();'
      - name: phone screenshots (390)
        if: ${{ inputs.shots }}
        env:
          URL: ${{ inputs.url }}
        run: |
          npm i -s playwright@1 >/dev/null 2>&1
          npx -y playwright install chromium 2>&1 | tail -3
          # 11/12 태국어·한중일 글꼴 (없으면 캡처에 네모 칸)
          sudo apt-get install -y -qq fonts-thai-tlwg fonts-noto-cjk >/dev/null 2>&1 || true
          mkdir -p shots
          node -e '
          const { chromium, devices } = require("playwright");
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ ...devices["iPhone 13"], locale: "ko-KR" });
            const pg = await ctx.newPage();
            await pg.goto(process.env.URL, { waitUntil: "load" }); await pg.waitForTimeout(3000);
            await pg.addStyleTag({ content: "#shopify-pc__banner,.shopify-pc__banner__dialog{display:none!important}" });  // 11/12 쿠키 창이 버튼 가림
            const lab = await pg.evaluate(() => { const af = s => { const e = document.querySelector(s); return e ? getComputedStyle(e, "::after").content : "-"; };
              const so = document.querySelector(".variant-option__button-label:has(input[data-option-available=false]) .variant-option__button-label__text");
              return { lang: document.documentElement.lang, cart: af(".product-form-buttons .add-to-cart-text__content"), buy: af(".product-form-buttons .shopify-payment-button__button--unbranded"),
                sbar: (document.querySelector(".dmc-sbar button") || {}).textContent || "-", kakao_exchange: document.querySelectorAll(".dmp-benefit,.dmp-kakao,.dmc-kk").length, kakao_in_main: ((document.querySelector("main") || document.body).textContent || "").split(/Kakao|카카오/).length - 1, soldout: so ? getComputedStyle(so, "::after").content : "-" }; });
            console.log("버튼 글자:", JSON.stringify(lab));
            if (process.env.ACT) { const r = await pg.evaluate("(async () => {" + process.env.ACT + "})()"); await pg.waitForTimeout(1500); console.log("act 결과:", JSON.stringify(r)); await pg.evaluate(() => window.scrollTo(0, 0)); }
            const H = await pg.evaluate(() => document.documentElement.scrollHeight);
            const vh = 844; let i = 0;
            for (let y = 0; y < H && i < 24; y += vh * 0.9, i++) {
              await pg.evaluate(v => window.scrollTo(0, v), y); await pg.waitForTimeout(900);
              await pg.screenshot({ path: `shots/${String(i).padStart(2,"0")}.jpg`, type: "jpeg", quality: 60 });
            }
            const ow = await pg.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
            console.log("height", H, "shots", i, "가로 넘침(px)", ow);
            // 11/16 PC 1440 한 장(전체 길이) — PC·폰 같이 판정
            const pc = await (await b.newContext({ viewport: { width: 1440, height: 900 }, locale: "ko-KR" })).newPage();
            await pc.goto(process.env.URL, { waitUntil: "load" }); await pc.waitForTimeout(3000);
            await pc.addStyleTag({ content: "#shopify-pc__banner,.shopify-pc__banner__dialog{display:none!important}" });
            await pc.screenshot({ path: "shots/pc-1440.jpg", type: "jpeg", quality: 60, fullPage: true });
            console.log("PC 가로 넘침(px)", await pc.evaluate(() => document.documentElement.scrollWidth - window.innerWidth));
            await b.close();
          })();'
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.shots }}
        with:
          name: shots
          path: shots/
