# 라이브 페이지 한 장 실측 — 맥 IP 가 쇼피파이에 429 로 막혔을 때 깃허브 서버에서 대신 받아 본다 (2026-10-30 와소코 가격 확인)
# 실행: gh workflow run live-check.yml -f url=<주소> -f pattern='<grep 정규식>'
name: live-check
on:
  workflow_dispatch:
    inputs:
      url:
        description: 확인할 주소
        required: true
      pattern:
        description: 페이지에서 찾을 글자(grep -E)
        required: false
        default: 'fbq\('
      shots:
        description: 폰 390 화면 캡처(스크롤 위치별) → 실행 결과 「shots」 파일로 받기 (11/11)
        type: boolean
        default: false
      cart_attr:
        description: 브라우저로 열어 장바구니 속성(유입 등) 출력
        type: boolean
        default: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: fetch
        env:
          URL: ${{ inputs.url }}
          PAT: ${{ inputs.pattern }}
        run: |
          code=$(curl -sL -A "Mozilla/5.0" -o page.html -w '%{http_code}' "$URL")
          echo "HTTP $code"
          echo "fbq 개수: $(grep -o 'fbq(' page.html | wc -l)"
          echo "--- 찾은 것 ---"
          grep -oE "$PAT" page.html | head -20 || true
          [ "$code" = 200 ]
      - name: cart attributes (실제 브라우저)
        if: ${{ inputs.cart_attr }}
        env:
          URL: ${{ inputs.url }}
        run: |
          npm i -s playwright@1 >/dev/null 2>&1 && npx -y playwright install chromium >/dev/null 2>&1
          node -e '
          const { chromium } = require("playwright");
          (async () => {
            const b = await chromium.launch(); const pg = await b.newPage();
            await pg.goto(process.env.URL, { waitUntil: "load" }); await pg.waitForTimeout(4000);
            const c = await pg.evaluate(() => fetch("/cart.js").then(r => r.json()));
            console.log("장바구니 속성:", JSON.stringify(c.attributes)); await b.close();
          })();'
      - name: phone screenshots (390)
        if: ${{ inputs.shots }}
        env:
          URL: ${{ inputs.url }}
        run: |
          npm i -s playwright@1 >/dev/null 2>&1
          npx -y playwright install chromium 2>&1 | tail -3
          # 11/12 태국어·한중일 글꼴 (없으면 캡처에 네모 칸)
          sudo apt-get install -y -qq fonts-thai-tlwg fonts-noto-cjk >/dev/null 2>&1 || true
          mkdir -p shots
          node -e '
          const { chromium, devices } = require("playwright");
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ ...devices["iPhone 13"], locale: "ko-KR" });
            const pg = await ctx.newPage();
            await pg.goto(process.env.URL, { waitUntil: "load" }); await pg.waitForTimeout(3000);
            await pg.addStyleTag({ content: "#shopify-pc__banner,.shopify-pc__banner__dialog{display:none!important}" });  // 11/12 쿠키 창이 버튼 가림
            const lab = await pg.evaluate(() => { const af = s => { const e = document.querySelector(s); return e ? getComputedStyle(e, "::after").content : "-"; };
              const so = document.querySelector(".variant-option__button-label:has(input[data-option-available=false]) .variant-option__button-label__text");
              return { lang: document.documentElement.lang, cart: af(".product-form-buttons .add-to-cart-text__content"), buy: af(".product-form-buttons .shopify-payment-button__button--unbranded"),
                sbar: (document.querySelector(".dmc-sbar button") || {}).textContent || "-", kakao_exchange: document.querySelectorAll(".dmp-benefit,.dmp-kakao,.dmc-kk").length, kakao_in_buybox: ((document.querySelector(".product-details") || {}).textContent || "").split("Kakao").length - 1, soldout: so ? getComputedStyle(so, "::after").content : "-" }; });
            console.log("버튼 글자:", JSON.stringify(lab));
            const H = await pg.evaluate(() => document.documentElement.scrollHeight);
            const vh = 844; let i = 0;
            for (let y = 0; y < H && i < 24; y += vh * 0.9, i++) {
              await pg.evaluate(v => window.scrollTo(0, v), y); await pg.waitForTimeout(900);
              await pg.screenshot({ path: `shots/${String(i).padStart(2,"0")}.jpg`, type: "jpeg", quality: 60 });
            }
            const ow = await pg.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
            console.log("height", H, "shots", i, "가로 넘침(px)", ow);
            await b.close();
          })();'
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.shots }}
        with:
          name: shots
          path: shots/
