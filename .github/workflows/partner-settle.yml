# 파트너 정산 매일 자동 갱신 — 클라우드판 (2026-10-30)
#
# 🪤 이게 생긴 이유 — 맥 launchd(run-settle.sh)는 그 맥이 꺼져 있으면 안 돈다.
#    10/29 아침 갱신이 그렇게 빠졌다(파트너 화면이 10/28 숫자에서 멈춤). 맥과 무관하게 깃허브에서 돈다.
#
# 규칙(정산 코드·rates.json·tokens.json)의 원본은 company-dari/darimati-theme tools/settle/ — 여기 복사하지 않고 매번 받아 쓴다.
#   읽기 전용 배포 키(THEME_DEPLOY_KEY)로 받는다.
# 쇼피파이 = Dev Dashboard 앱 「재고 대시보드 읽기」 client_credentials(아이디+암호 → 그때그때 짧은 토큰). 긴 토큰 없음.
# 실패하면 → 슬랙 #지운-클로드-알림창(SLACK_WEBHOOK) + 이슈. 실패해도 파트너 화면은 지난 숫자 그대로(빈 화면 안 됨).
# 멈춤(성공인데 숫자 갱신 0) 감시는 watchdog.yml ⑤-2(40시간)가 따로 한다.

name: 파트너 정산 매일 갱신

on:
  schedule:
    - cron: '5 1 * * *'     # 매일 오전 10:05 (한국시간)
    - cron: '5 6 * * *'     # 매일 오후 15:05 (한국시간) — 10/30 사장님 「오전·오후」
  workflow_dispatch:         # 손으로 돌리기

permissions:
  contents: write            # partner/data 갱신 push
  issues: write              # 실패 시 이슈

concurrency:
  group: partner-settle
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          path: darimati-dash
      - uses: actions/checkout@v4
        with:
          repository: company-dari/darimati-theme
          ssh-key: ${{ secrets.THEME_DEPLOY_KEY }}
          path: darimati-theme
          sparse-checkout: tools/settle

      - name: 쇼피파이 짧은 토큰 받기
        env:
          CID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          CSECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          CSECRET=$(printf '%s' "$CSECRET" | tr -d '[:space:]'); CID=$(printf '%s' "$CID" | tr -d '[:space:]')
          echo "암호 길이: ${#CSECRET} (shpss_ 로 시작: $([ "${CSECRET#shpss_}" != "$CSECRET" ] && echo 예 || echo 아니오))"
          RESP=$(curl -s -w '\nHTTP %{http_code}' -X POST "https://pgwbea-fc.myshopify.com/admin/oauth/access_token" \
            -H 'Content-Type: application/json' \
            -d "{\"client_id\":\"$CID\",\"client_secret\":\"$CSECRET\",\"grant_type\":\"client_credentials\"}")
          TOKEN=$(echo "$RESP" | sed '$d' | python3 -c 'import sys,json;print(json.load(sys.stdin).get("access_token",""))' 2>/dev/null || true)
          [ -z "$TOKEN" ] && { echo "❌ 토큰 못 받음 ($(echo "$RESP" | tail -1)): $(echo "$RESP" | sed '$d' | tr -d '\n' | sed 's/<[^>]*>//g' | head -c 300)"; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "SHOPIFY_ADMIN_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "권한: $(echo "$RESP" | sed '$d' | python3 -c 'import sys,json;print(json.load(sys.stdin).get("scope",""))')"

      - name: 정산 계산 → 파트너 화면 파일 갱신
        env:
          HOME: ${{ github.workspace }}   # publish-partner.py 가 ~/darimati-dash/partner/data 에 쓴다
        run: |
          NOW="$(date '+%Y-%m-%d %H:%M:%S')"
          for TRY in 1 2 3; do
            python3 darimati-theme/tools/settle/shopify-settle.py > settle.txt 2>&1 && \
            python3 darimati-theme/tools/settle/shopify-settle.py --json > /dev/null && break
            echo "⏳ ${TRY}번째 실패 — 60초 뒤 재시도"; tail -5 settle.txt
            [ $TRY -lt 3 ] && sleep 60 || exit 1
          done
          sed -n 1,20p settle.txt
          python3 darimati-theme/tools/settle/publish-partner.py
          cd darimati-dash
          if git diff --quiet -- partner/data; then echo "바뀐 숫자 없음"; exit 0; fi
          git config user.name "darimati-settle-bot"
          git config user.email "actions@users.noreply.github.com"
          git add partner/data
          git commit -q -m "파트너 정산 갱신 $NOW (클라우드)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 10; done

      - name: 실패하면 슬랙 + 이슈
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT="🔴 *파트너 정산 자동갱신 실패* ($(date '+%m/%d %H:%M'))
          → 파트너 화면 숫자가 어제 기준에서 멈춰 있습니다(화면은 안 깨짐). 터미널 클로드에게 「정산 실패 확인해줘」
          기록: $RUN_URL"
          [ -n "$SLACK_WEBHOOK" ] && python3 -c 'import json,sys,urllib.request;urllib.request.urlopen(urllib.request.Request(sys.argv[1],data=json.dumps({"text":sys.argv[2]}).encode(),headers={"Content-Type":"application/json"}))' "$SLACK_WEBHOOK" "$TEXT" || true
          cd darimati-dash && gh issue create -t "파트너 정산 실패 $(date '+%Y-%m-%d')" -b "$TEXT" || true
