# 나라별 손님 화면 실측 (2026-11-09) — 13개 나라 × 첫 화면·상세·블로그 글
# 실행: gh workflow run country-check.yml  → 요약 표 + 캡처(artifact country-shots)
name: country-check
on:
  schedule:
    - cron: '50 0 * * *'   # 매일 09:50 KST (감시 09:30 뒤)
  workflow_dispatch:
    inputs:
      preview_theme_id:
        description: 미리보기 테마 번호(비우면 라이브)
        required: false
        default: ''
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 브라우저 준비
        run: npm i -s playwright@1 >/dev/null 2>&1 && npx -y playwright install --with-deps chromium >/dev/null 2>&1
      - name: 나라별 실측
        env:
          PV: ${{ inputs.preview_theme_id }}
        run: node .github/scripts/country_check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: country-shots
          path: |
            shots/
            report.md
      - name: 다르면 이슈로 알리기
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '나라별 점검이 실행되지 못했습니다.';
            try { body = fs.readFileSync('report.md', 'utf8'); } catch (e) {}
            body += `\n\n실행 기록: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = '🔴 나라별 화면 불일치 — ' + new Date().toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul' });
            const open = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'watchdog' });
            const same = open.data.find(i => i.title === title);
            if (same) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: same.number, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['watchdog'] });
