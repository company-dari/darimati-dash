name: discount-check
# QR/링크로 들어온 손님처럼 열고 → 상품 담고 → 장바구니 할인 금액 확인 (주문은 넣지 않음)
on:
  workflow_dispatch:
    inputs:
      url:
        description: 손님이 여는 주소 (QR 주소 등)
        required: true
      items:
        description: "변형ID:수량 쉼표 구분 (예 46121999761468:2,50562072084540:1)"
        required: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: open + add + read cart
        env:
          URL: ${{ inputs.url }}
          ITEMS: ${{ inputs.items }}
        run: |
          npm i -s playwright@1 >/dev/null 2>&1 && npx -y playwright install chromium >/dev/null 2>&1
          node -e '
          const { chromium } = require("playwright");
          (async () => {
            const b = await chromium.launch(); const ctx = await b.newContext({ locale: "ko-KR" });
            // 깃허브 서버는 미국 → 한국 손님으로 보이게 (미국 시장엔 한국 상품이 안 팔린다)
            await ctx.addCookies([{ name: "localization", value: "KR", domain: ".darimati.us", path: "/" }, { name: "cart_currency", value: "KRW", domain: ".darimati.us", path: "/" }]);
            const pg = await ctx.newPage();
            await pg.goto(process.env.URL, { waitUntil: "load" }); await pg.waitForTimeout(6000);
            console.log("착지:", pg.url());
            console.log("fbq:", await pg.evaluate(() => typeof window.fbq));
            const items = process.env.ITEMS.split(",").map(s => { const [id,q] = s.split(":"); return { id: +id, quantity: +q }; });
            const r = await pg.evaluate(async (items) => {
              const log = [];
              for (const it of items) {
                const a = await fetch("/cart/add.js", { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify({ items: [it] }) });
                log.push(it.id + "→" + a.status + (a.ok ? "" : " " + (await a.text()).slice(0,120)));
              }
              await new Promise(r => setTimeout(r, 1500)); const t = await fetch("/cart.js", { headers: { Accept: "application/json" } }).then(r => r.text()); let c; try { c = JSON.parse(t); } catch (e) { return { _add: log.join(" | ") + " / cart.js 응답: " + t.slice(0,150), items: [], discount_codes: [] }; } c._add = log.join(" | "); c._cur = c.currency; return c;
            }, items);
            console.log("담기:", r._add);
            console.log("코드:", JSON.stringify(r.discount_codes));
            for (const it of r.items) console.log("줄:", it.product_title, "x"+it.quantity, "원가", it.original_line_price/100, "할인후", it.final_line_price/100, JSON.stringify((it.line_level_discount_allocations||[]).map(a=>[a.discount_application.title,a.amount/100])));
            console.log("합계: 원가", r.original_total_price/100, "할인", r.total_discount/100, "결제", r.total_price/100);
            console.log("통화:", r._cur);
            console.log("속성:", JSON.stringify(r.attributes));
            await b.close();
          })();'
