<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>DARIMATI SHUTTLE RUN · 기록판</title>
<style>
  :root {
    --ground: #07090a;
    --panel: #0e1316;
    --rule: #1c2429;
    --text: #ecf1f3;
    --muted: #78878f;
    --dim: #4d5a61;
    --signal: #ff5a28;
    --gold: #e7c46b;
    --silver: #b9c4ca;
    --bronze: #b9793f;
    --live: #4ade80;
    --font-ui: system-ui, -apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    --font-num: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --s: 1;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .board {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: calc(1.8rem * var(--s)) clamp(1rem, 3vw, 3.2rem) calc(1.2rem * var(--s));
  }

  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 0.6rem 2rem;
    padding-bottom: calc(0.9rem * var(--s));
  }
  .eyebrow {
    font-family: var(--font-num);
    font-size: calc(0.7rem * var(--s));
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--dim);
    margin: 0 0 calc(0.45rem * var(--s));
  }
  h1 {
    margin: 0;
    font-size: calc(2.4rem * var(--s));
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 0.95;
  }
  h1 .slash { color: var(--signal); }
  .status {
    display: flex;
    align-items: baseline;
    gap: calc(1.3rem * var(--s));
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
  }
  .status .cnt {
    font-size: calc(0.72rem * var(--s));
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .status .cnt b { color: var(--text); font-weight: 700; }
  .status .clock { font-size: calc(1.6rem * var(--s)); font-weight: 700; }

  .tabs {
    display: flex;
    gap: calc(0.35rem * var(--s));
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: calc(0.45rem * var(--s)) 0;
    margin-bottom: calc(1.1rem * var(--s));
  }
  .tab {
    font-size: calc(0.95rem * var(--s));
    font-weight: 700;
    color: var(--muted);
    padding: calc(0.4rem * var(--s)) calc(1rem * var(--s));
    border-radius: 2px;
    white-space: nowrap;
  }
  .tab.on { color: var(--ground); background: var(--signal); }
  .tab .n { font-family: var(--font-num); font-size: 0.8em; opacity: 0.6; margin-left: 0.5em; }

  .colhead, .row {
    display: grid;
    grid-template-columns: calc(3rem * var(--s)) 1fr auto;
    align-items: baseline;
    gap: calc(1.1rem * var(--s));
  }
  .colhead {
    font-family: var(--font-num);
    font-size: calc(0.68rem * var(--s));
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--dim);
    padding-bottom: calc(0.5rem * var(--s));
  }
  .colhead .t { text-align: right; }

  .scroller { flex: 1; overflow: hidden; }
  .list { display: block; }
  .list.split { display: grid; grid-auto-flow: column; column-gap: clamp(2rem, 5vw, 5rem); }

  .row {
    padding: calc(0.42rem * var(--s)) calc(0.55rem * var(--s));
    margin-left: calc(-0.55rem * var(--s));
    border-bottom: 1px solid var(--rule);
  }
  .row .rank {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: calc(1.1rem * var(--s));
    font-weight: 700;
    color: var(--dim);
  }
  .row .name {
    font-size: calc(1.8rem * var(--s));
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .time {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: calc(1.8rem * var(--s));
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .row.p1 { background: linear-gradient(90deg, rgba(255,90,40,.12), transparent 60%); }
  .row.p1 .rank { color: var(--gold); }
  .row.p2 .rank { color: var(--silver); }
  .row.p3 .rank { color: var(--bronze); }
  .row.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: rgba(255,90,40,.3); } to { background: transparent; } }

  .pending { border-top: 1px solid var(--rule); padding-top: calc(0.8rem * var(--s)); margin-top: calc(1rem * var(--s)); }
  .pending h2 {
    font-family: var(--font-num);
    font-size: calc(0.68rem * var(--s));
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--dim);
    font-weight: 400;
    margin: 0 0 calc(0.55rem * var(--s));
  }
  .pending ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: calc(0.3rem * var(--s)) calc(1.5rem * var(--s)); }
  .pending li { font-size: calc(1.2rem * var(--s)); font-weight: 600; color: var(--muted); }

  .empty { padding: calc(2.5rem * var(--s)) 0; color: var(--dim); font-size: calc(1.05rem * var(--s)); }

  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding-top: calc(0.8rem * var(--s));
    font-family: var(--font-num);
    font-size: calc(0.66rem * var(--s));
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .conn { display: flex; align-items: center; gap: 0.5em; }
  .dot { width: 0.5em; height: 0.5em; border-radius: 50%; background: var(--dim); }
  .conn.ok .dot { background: var(--live); }
  .conn.bad .dot { background: var(--signal); }

  .ctl { position: fixed; right: 0.6rem; bottom: 0.6rem; display: flex; gap: 0.35rem; opacity: 0.16; transition: opacity .2s; z-index: 20; }
  .ctl:hover { opacity: 1; }
  .ctl button {
    appearance: none; background: var(--panel); border: 1px solid var(--rule); color: var(--muted);
    font-family: var(--font-ui); font-size: .8rem; font-weight: 700; padding: .45rem .75rem; border-radius: 3px; cursor: pointer;
  }
  .ctl button:hover { color: var(--text); }
  button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<main class="board">
  <header class="masthead">
    <div>
      <p class="eyebrow" id="eyebrow">REXTREME 2026 · 수원컨벤션센터 · 08.01</p>
      <h1>DARIMATI <span class="slash">/</span> SHUTTLE RUN</h1>
    </div>
    <div class="status">
      <span class="cnt">기록 <b id="cntDone">0</b> / <span id="cntAll">0</span></span>
      <span class="clock" id="clock">--:--</span>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <div class="colhead"><span>#</span><span>NAME</span><span class="t">TIME</span></div>

  <div class="scroller"><div class="list" id="list"></div></div>

  <section class="pending" id="pendingBox" hidden>
    <h2>기록 대기</h2>
    <ul id="pending"></ul>
  </section>

  <div class="foot">
    <span class="conn" id="conn"><span class="dot"></span><span id="connText">연결 확인 중</span></span>
    <span>DARIMATI SHUTTLE RUN CHALLENGE</span>
  </div>
</main>

<div class="ctl">
  <button type="button" id="fontDown">A−</button>
  <button type="button" id="fontUp">A+</button>
  <button type="button" id="fsBtn">전체화면</button>
</div>

<script>
(function () {
  "use strict";

  /* 배포된 Apps Script 웹앱 주소. 비어 있으면 같은 브라우저(로컬) 모드로 동작합니다.
     주소 없이 임시로 쓰려면 ?api=... 를 붙여도 됩니다. */
  var API_URL = "";

  var LKEY = "rextreme_shuttle_v1";   // 로컬 모드 저장소 (운영 페이지와 공유)
  var VKEY = "rextreme_board_view";   // 글자 크기 등 화면 설정
  var DIVS = ["1", "2", "3"];

  var qs = new URLSearchParams(location.search);
  var api = qs.get("api") || localStorage.getItem("rex_api") || API_URL;
  if (qs.get("api")) localStorage.setItem("rex_api", qs.get("api"));

  var forcedDiv = qs.get("div");
  var view = { rows: [], cfg: { sort: "asc", live: "1", title: "" } };
  var shownDiv = forcedDiv || "1";
  var rotateAt = 0;
  var lastSig = "";
  var lastOkAt = null;
  var flashKeys = {};

  /* ── 표시 유틸 ─────────────────────────────────── */

  function fmt(sec) {
    if (sec === null || sec === undefined || sec === "") return "";
    var n = Number(sec);
    var m = Math.floor(n / 60), s = n % 60;
    return m + ":" + (s < 10 ? "0" + s : s);
  }
  function two(n) { return n < 10 ? "0" + n : "" + n; }

  /* ── 데이터 가져오기 ───────────────────────────── */

  function loadLocal() {
    try {
      var raw = localStorage.getItem(LKEY);
      var p = raw ? JSON.parse(raw) : null;
      if (!p || !Array.isArray(p.athletes)) return { rows: [], cfg: view.cfg };
      return {
        rows: p.athletes.map(function (a) { return { d: a.div, n: a.name, t: a.time, s: a.seq }; }),
        cfg: p.cfg || { sort: "asc", live: "1", title: "" }
      };
    } catch (e) { return { rows: [], cfg: view.cfg }; }
  }

  function apply(data, ok) {
    view.rows = data.rows || [];
    if (data.cfg) view.cfg = data.cfg;
    if (ok) { lastOkAt = new Date(); setConn("ok", "실시간 연결됨"); }
    var sig = JSON.stringify(view.rows);
    if (sig !== lastSig) { markFlash(sig); lastSig = sig; render(); }
    else { renderStatusOnly(); }
  }

  var prevTimes = {};
  function markFlash(sig) {
    flashKeys = {};
    view.rows.forEach(function (r) {
      var k = r.d + "|" + r.n + "|" + r.s;
      if (prevTimes[k] === undefined && r.t !== null) flashKeys[k] = 1;
      else if (prevTimes[k] !== r.t && r.t !== null) flashKeys[k] = 1;
      prevTimes[k] = r.t;
    });
  }

  function setConn(cls, text) {
    var el = document.getElementById("conn");
    el.className = "conn " + cls;
    var stamp = lastOkAt ? " · " + two(lastOkAt.getHours()) + ":" + two(lastOkAt.getMinutes()) + ":" + two(lastOkAt.getSeconds()) : "";
    document.getElementById("connText").textContent = text + stamp;
  }

  function poll() {
    if (!api) { apply(loadLocal(), false); setConn("", "로컬 모드 · 같은 브라우저에서만 동기화"); return; }
    fetch(api + (api.indexOf("?") > -1 ? "&" : "?") + "a=board&_=" + new Date().getTime(), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.ok) throw new Error("bad payload");
        apply(j, true);
      })
      .catch(function () {
        setConn("bad", lastOkAt ? "연결 끊김 · 마지막 갱신" : "연결 실패 · 주소 확인 필요");
      });
  }

  /* ── 순위 계산 ─────────────────────────────────── */

  function ranked(div) {
    var asc = String(view.cfg.sort || "asc") !== "desc";
    var done = view.rows
      .filter(function (a) { return a.d === div && a.t !== null && a.t !== undefined && a.t !== ""; })
      .sort(function (a, b) { return asc ? (a.t - b.t || a.s - b.s) : (b.t - a.t || a.s - b.s); });
    var rank = 0, prev = null, out = [];
    done.forEach(function (a, i) {
      if (a.t !== prev) { rank = i + 1; prev = a.t; }
      out.push({ a: a, rank: rank });
    });
    return out;
  }
  function pendingOf(div) {
    return view.rows.filter(function (a) { return a.d === div && (a.t === null || a.t === undefined || a.t === ""); });
  }

  function pickDiv() {
    if (forcedDiv) return forcedDiv;
    var live = String(view.cfg.live || "1");
    if (live !== "rotate") return DIVS.indexOf(live) > -1 ? live : "1";
    var have = DIVS.filter(function (d) {
      return view.rows.some(function (r) { return r.d === d; });
    });
    if (!have.length) return "1";
    var now = new Date().getTime();
    if (now > rotateAt) { rotateAt = now + 20000; shownDiv = have[(have.indexOf(shownDiv) + 1) % have.length]; }
    return have.indexOf(shownDiv) > -1 ? shownDiv : have[0];
  }

  /* ── 렌더 ──────────────────────────────────────── */

  var elTabs = document.getElementById("tabs");
  var elList = document.getElementById("list");
  var elPending = document.getElementById("pending");
  var elPendingBox = document.getElementById("pendingBox");

  function renderStatusOnly() {
    var d = pickDiv();
    if (d !== shownDiv) { shownDiv = d; render(); }
  }

  function render() {
    shownDiv = pickDiv();
    var rows = ranked(shownDiv);
    var wait = pendingOf(shownDiv);

    document.getElementById("cntDone").textContent = rows.length;
    document.getElementById("cntAll").textContent = rows.length + wait.length;

    elTabs.innerHTML = "";
    DIVS.forEach(function (d) {
      var n = view.rows.filter(function (r) { return r.d === d; }).length;
      var s = document.createElement("span");
      s.className = "tab" + (d === shownDiv ? " on" : "");
      s.innerHTML = d + "부<span class='n'>" + n + "</span>";
      elTabs.appendChild(s);
    });

    elList.innerHTML = "";
    if (!rows.length) {
      var p = document.createElement("p");
      p.className = "empty";
      p.textContent = wait.length
        ? "등록 " + wait.length + "명 · 첫 기록을 기다리는 중"
        : "곧 시작합니다";
      elList.appendChild(p);
      elList.classList.remove("split");
      elList.style.gridTemplateRows = "";
    } else {
      rows.forEach(function (r) {
        var k = r.a.d + "|" + r.a.n + "|" + r.a.s;
        var div = document.createElement("div");
        div.className = "row" + (r.rank <= 3 ? " p" + r.rank : "") + (flashKeys[k] ? " flash" : "");
        div.innerHTML = "<span class='rank'>" + r.rank + "</span><span class='name'></span><span class='time'>" + fmt(r.a.t) + "</span>";
        div.querySelector(".name").textContent = r.a.n;
        elList.appendChild(div);
      });
      if (rows.length >= 16) {
        elList.classList.add("split");
        elList.style.gridTemplateRows = "repeat(" + Math.ceil(rows.length / 2) + ", auto)";
      } else {
        elList.classList.remove("split");
        elList.style.gridTemplateRows = "";
      }
    }
    flashKeys = {};

    elPendingBox.hidden = wait.length === 0;
    elPending.innerHTML = "";
    wait.slice(0, 24).forEach(function (a) {
      var li = document.createElement("li");
      li.textContent = a.n;
      elPending.appendChild(li);
    });
  }

  /* ── 화면 설정 ─────────────────────────────────── */

  var vs = { scale: 1 };
  try { vs = JSON.parse(localStorage.getItem(VKEY)) || vs; } catch (e) {}
  function applyScale() { document.documentElement.style.setProperty("--s", vs.scale); }
  function saveView() { try { localStorage.setItem(VKEY, JSON.stringify(vs)); } catch (e) {} }

  document.getElementById("fontUp").addEventListener("click", function () {
    vs.scale = Math.min(2.4, Math.round((vs.scale + 0.1) * 10) / 10); applyScale(); saveView();
  });
  document.getElementById("fontDown").addEventListener("click", function () {
    vs.scale = Math.max(0.6, Math.round((vs.scale - 0.1) * 10) / 10); applyScale(); saveView();
  });
  document.getElementById("fsBtn").addEventListener("click", function () {
    if (!document.fullscreenElement) { (document.documentElement.requestFullscreen || function(){}).call(document.documentElement); }
    else { document.exitFullscreen(); }
  });

  /* ── 시계 · 구동 ───────────────────────────────── */

  function tick() {
    var d = new Date();
    document.getElementById("clock").textContent = two(d.getHours()) + ":" + two(d.getMinutes());
  }

  window.addEventListener("storage", function (e) { if (e.key === LKEY) poll(); });

  applyScale();
  tick(); setInterval(tick, 10000);
  poll(); setInterval(poll, 3000);
})();
</script>
</body>
</html>
