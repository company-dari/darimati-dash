<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>DARIMATI 셔틀런 챌린지 · 기록판</title>
<style>
  :root {
    --ground: #06080a;
    --panel: #0e1316;
    --rule: #1c2429;
    --rule-strong: #2b373e;
    --text: #f2f6f8;
    --muted: #7d8c95;
    --dim: #4b585f;
    --signal: #ff5a28;
    --gold: #f0cf7a;
    --silver: #c2ccd2;
    --bronze: #d99a5c;
    --live: #4ade80;
    --men: #4aa8ff;      /* 남자부 강조색 */
    --women: #ffb03a;    /* 여자부 강조색 */
    --font-ui: system-ui, -apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    --font-num: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    /* 크기의 기준 단위 = 화면의 짧은 변의 1%.
       가로로 두든 세로로 눕히든 패널의 짧은 변은 같으므로, 글자가 물리적으로 같은 크기로 유지된다.
       (가로 화면에서는 1vh 와 완전히 같은 값이라 기존 화면이 그대로다) */
    --u: 1vmin;
    --s: 1;          /* 전체 배율 (A+ / A−) */
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--text);
    font-family: var(--font-ui); -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .board { height: 100%; display: flex; flex-direction: column; padding: 0 clamp(1rem, 2.6vw, 3rem); }

  /* ── 브랜드 밴드 ─────────────────────────────── */
  .brand {
    display: flex; align-items: center; justify-content: space-between;
    gap: 2rem; padding: calc(3.6 * var(--u)) 0 calc(2 * var(--u)); border-bottom: 1px solid var(--rule-strong);
  }
  .lockup { display: flex; align-items: center; gap: clamp(.8rem, 1.8vw, 1.8rem); min-width: 0; }
  .mark { height: calc(calc(10 * var(--u)) * var(--s)); width: auto; color: var(--signal); flex: none; }
  /* DARIMATI 워드마크는 안 쓴다 — 마크와 챌린지 두 개만 남겨 헤더를 단순화 */
  .wordmark { display: none; }
  .lockup .stack { display: flex; flex-direction: column; gap: calc(1 * var(--u)); min-width: 0; }
  .challenge {
    display: flex; flex-direction: column; align-items: flex-start; gap: calc(.9 * var(--u));
    font-size: calc(calc(4.6 * var(--u)) * var(--s)); font-weight: 800; letter-spacing: -.035em; line-height: 1;
  }
  .challenge em {
    font-style: normal; font-family: var(--font-num); font-weight: 700;
    font-size: .34em; letter-spacing: .18em; color: var(--signal); text-transform: uppercase;
  }
  .meta { display: flex; align-items: center; gap: clamp(.9rem, 2vw, 2.2rem); flex: none; }
  .divpill {
    font-size: calc(calc(2.6 * var(--u)) * var(--s)); font-weight: 800; letter-spacing: -.02em;
    background: var(--signal); color: #170500; padding: .35em .7em; border-radius: 3px; line-height: 1;
  }
  .clock {
    font-family: var(--font-num); font-variant-numeric: tabular-nums;
    font-size: calc(calc(2.9 * var(--u)) * var(--s)); font-weight: 700; color: var(--muted);
  }

  /* ── 남자부 / 여자부 반반 ─────────────────────
     시상이 매 부마다 남·여 따로라, 화면을 위아래로 갈라 각각 순위를 보여준다.
     위 = 남자, 아래 = 여자. 각 칸에 시상 대상인 1·2·3위만 크게 띄운다. */
  .halves { flex: 1; min-height: 0; display: grid; grid-template-rows: 1fr 1fr; }
  .half { min-height: 0; display: flex; flex-direction: column; }
  .half + .half { border-top: 2px solid var(--rule-strong); }
  .half[data-sex="M"] { --accent: var(--men); }
  .half[data-sex="F"] { --accent: var(--women); }

  /* ── 시상대 (1·2·3위) ─────────────────────────
     시상이 남/여 각각 1·2·3위라 화면에도 딱 세 명만 크게 띄운다. */
  .hlabel {
    display: flex; align-items: center; gap: .7em; padding: calc(1.4 * var(--u)) 0 calc(.6 * var(--u));
  }
  .hlabel .sexchip {
    font-size: calc(calc(3.2 * var(--u)) * var(--s)); font-weight: 800; letter-spacing: -.01em; line-height: 1;
    background: var(--accent); color: #10131a; padding: .3em .65em; border-radius: 3px;
  }
  .hlabel em {
    font-style: normal; font-family: var(--font-num); font-size: calc(calc(1.7 * var(--u)) * var(--s));
    font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: var(--accent);
  }

  .podium { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center;
    gap: calc(1.1 * var(--u)); overflow: hidden; }
  .pod {
    display: grid; grid-template-columns: 1.15em 1fr auto; align-items: baseline;
    column-gap: .45em; line-height: 1;
  }
  .pod .pk { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 700; font-size: .62em; }
  .pod .pn { font-weight: 800; letter-spacing: -.035em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pod .pt { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: -.04em; }

  .pod.p1 { font-size: calc(calc(9 * var(--u)) * var(--s) * var(--pf, 1)); }
  .pod.p2, .pod.p3 { font-size: calc(calc(5.4 * var(--u)) * var(--s) * var(--pf, 1)); }
  .pod.p1 .pk { color: var(--accent); }
  .pod.p1 .pt { color: var(--gold); }
  .pod.p2 .pk, .pod.p2 .pt { color: var(--silver); }
  .pod.p3 .pk, .pod.p3 .pt { color: var(--bronze); }
  .pod.p2 .pn, .pod.p3 .pn { color: #d7e0e5; }

  /* 1위 줄만 은은한 배경 — 어느 쪽이 남/여인지 멀리서도 구분되게 */
  .pod.p1 { margin: 0 calc(-1 * clamp(1rem, 2.6vw, 3rem)); padding: .2em clamp(1rem, 2.6vw, 3rem); }
  .half[data-sex="M"] .pod.p1 { background: linear-gradient(90deg, rgba(74,168,255,.16), rgba(74,168,255,0) 75%); }
  .half[data-sex="F"] .pod.p1 { background: linear-gradient(90deg, rgba(255,176,58,.16), rgba(255,176,58,0) 75%); }

  .pod.flash { animation: flash 1.8s ease-out; }
  @keyframes flash { from { background: rgba(255,90,40,.32); } to { background: transparent; } }

  .empty { color: var(--dim); font-size: calc(calc(3 * var(--u)) * var(--s)); font-weight: 700; }

  /* ── 하단 안내 롤링 배너 ─────────────────────── */
  .notice {
    display: flex; align-items: center; gap: 1.2em; overflow: hidden;
    margin: 0 calc(-1 * clamp(1rem, 2.6vw, 3rem));
    padding: calc(2.1 * var(--u)) clamp(1rem, 2.6vw, 3rem);
    background: rgba(255, 90, 40, .09);
    border-top: 1px solid var(--rule-strong);
  }
  .notice[hidden] { display: none; }
  .notice .tag {
    flex: none; font-family: var(--font-num); font-size: calc(calc(1.8 * var(--u)) * var(--s));
    font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--signal);
    border: 1px solid var(--signal); border-radius: 999px; padding: .45em .9em; line-height: 1;
  }
  .notice .msg {
    font-size: calc(calc(3.7 * var(--u)) * var(--s)); font-weight: 700; letter-spacing: -.015em; line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: opacity .4s ease, transform .4s ease;
  }
  .notice .msg.out { opacity: 0; transform: translateY(-45%); }
  .notice .msg.below { opacity: 0; transform: translateY(45%); }

  /* ── 바닥 ────────────────────────────────────── */
  .foot {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 1.4rem;
    border-top: 1px solid var(--rule-strong); padding: calc(1.4 * var(--u)) 0 calc(1.6 * var(--u));
  }
  .conn { display: flex; align-items: center; gap: .55em;
    font-family: var(--font-num); font-size: calc(calc(1.35 * var(--u)) * var(--s)); letter-spacing: .16em;
    text-transform: uppercase; color: var(--dim); white-space: nowrap; }
  .dot { width: .55em; height: .55em; border-radius: 50%; background: var(--dim); }
  .conn.ok .dot { background: var(--live); }
  .conn.bad .dot { background: var(--signal); }

  .waiting { min-width: 0; display: flex; align-items: baseline; gap: .9em; overflow: hidden; }
  .waiting[hidden] { display: none; }
  .waiting .lbl { font-family: var(--font-num); font-size: calc(calc(1.35 * var(--u)) * var(--s)); letter-spacing: .16em;
    text-transform: uppercase; color: var(--dim); white-space: nowrap; flex: none; }
  .waiting .names { font-size: calc(calc(2 * var(--u)) * var(--s)); font-weight: 600; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .qr { display: flex; align-items: center; gap: .9em; }
  .qr .cap { text-align: right; line-height: 1.35; }
  .qr .cap b { display: block; font-size: calc(calc(1.9 * var(--u)) * var(--s)); font-weight: 800; letter-spacing: -.01em; }
  .qr .cap span { font-family: var(--font-num); font-size: calc(calc(1.25 * var(--u)) * var(--s)); letter-spacing: .14em;
    text-transform: uppercase; color: var(--dim); }
  .qr canvas { display: block; width: calc(calc(8 * var(--u)) * var(--s)); height: calc(calc(8 * var(--u)) * var(--s));
    background: #fff; padding: .5vh; border-radius: 3px; image-rendering: pixelated; }
  .qr[hidden] { display: none; }

  /* ── 신기록 연출 ─────────────────────────────── */
  .takeover {
    position: fixed; inset: 0; z-index: 60; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: calc(2 * var(--u));
    background: radial-gradient(circle at 50% 45%, #2a0d03 0%, #06080a 68%);
  }
  .takeover[data-show="true"] { display: flex; animation: fadein .35s ease-out; }
  .takeover .kicker {
    font-family: var(--font-num); font-size: calc(2.6 * var(--u)); letter-spacing: .42em; text-transform: uppercase;
    color: var(--signal); animation: pop .5s cubic-bezier(.2,1.4,.4,1) both;
  }
  .takeover .big { font-size: calc(17 * var(--u)); font-weight: 800; letter-spacing: -.045em; line-height: .95;
    animation: pop .55s .06s cubic-bezier(.2,1.4,.4,1) both; text-align: center; }
  .takeover .rec { font-family: var(--font-num); font-variant-numeric: tabular-nums;
    font-size: calc(13 * var(--u)); font-weight: 700; letter-spacing: -.04em; color: var(--gold);
    animation: pop .55s .13s cubic-bezier(.2,1.4,.4,1) both; }
  .takeover .sub { font-family: var(--font-num); font-size: calc(2.2 * var(--u)); letter-spacing: .28em;
    text-transform: uppercase; color: var(--muted); }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.94); } to { opacity: 1; transform: none; } }

  .banner {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: flex; align-items: baseline; gap: 1.2em; padding: calc(2 * var(--u)) clamp(1rem, 2.6vw, 3rem);
    background: var(--signal); color: #170500;
    transform: translateY(105%); transition: transform .3s cubic-bezier(.4,0,.2,1);
  }
  .banner[data-show="true"] { transform: translateY(0); }
  .banner .k { font-family: var(--font-num); font-size: calc(1.6 * var(--u)); letter-spacing: .28em; text-transform: uppercase; opacity: .75; }
  .banner .n { font-size: calc(4.4 * var(--u)); font-weight: 800; letter-spacing: -.03em; }
  .banner .t { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(4.4 * var(--u)); font-weight: 700; margin-left: auto; }

  .ctl { position: fixed; right: .7rem; top: .7rem; display: flex; gap: .4rem; opacity: .92; transition: opacity .2s; z-index: 70; }
  .ctl:hover { opacity: 1; }
  /* 마우스가 없는 TV 에서 리모콘 방향키로 버튼에 도달했을 때도 보이게 */
  .ctl:focus-within { opacity: 1; }
  .ctl button { appearance: none; background: rgba(20,26,31,.92); border: 1px solid var(--rule-strong); color: var(--text);
    font-family: var(--font-ui); font-size: .95rem; font-weight: 700; padding: .6rem 1rem; border-radius: 6px; cursor: pointer;
    backdrop-filter: blur(6px); }
  .ctl button:hover { color: var(--text); }
  button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  /* ── 세로로 길쭉한 화면일 때 ───────────────────
     화면이 세로면 JS 가 <html> 에 .pt 를 붙인다.
     모니터를 눕혀 세워 회전시킨 경우도 여기에 걸린다(아래 회전 모드 참고).
     글자 크기는 --u 가 알아서 맞추므로, 여기서는 "가로로 늘어놓던 것"만 세로로 쌓는다. */
  :root.pt .brand { flex-direction: column; align-items: stretch; gap: calc(1.8 * var(--u)); }
  /* 마크 옆에 챌린지 락업 — 세로 화면에서는 둘 다 키운다 */
  :root.pt .lockup { gap: clamp(1rem, 2.4vw, 2.4rem); }
  :root.pt .mark { height: calc(calc(13 * var(--u)) * var(--s)); }
  :root.pt .challenge { font-size: calc(calc(6.2 * var(--u)) * var(--s)); }
  :root.pt .meta { justify-content: space-between; }

  /* 세로 화면(=TV를 세워 쓰는 실제 현장)에서는 위아래가 넉넉하므로 전부 키운다.
     가로 폭이 한계라 1위 글자는 이 이상 못 키운다 — 넘치면 아래 autofit 이 자동으로 줄인다. */
  :root.pt .hlabel { padding: calc(1.6 * var(--u)) 0 calc(.8 * var(--u)); }
  :root.pt .hlabel .sexchip { font-size: calc(calc(4.4 * var(--u)) * var(--s)); }
  :root.pt .hlabel em { font-size: calc(calc(2.3 * var(--u)) * var(--s)); }
  :root.pt .podium { gap: calc(2 * var(--u)); }
  /* 순위 숫자 칸을 세 줄 모두 같은 폭으로 — 1·2·3위 이름 시작점이 딱 맞아야 읽기 편하다 */
  :root.pt .pod { grid-template-columns: calc(6.5 * var(--u)) 1fr auto; column-gap: calc(1.4 * var(--u)); }
  /* 1위는 이름 아래 기록 — 옆으로 나란히 두면 폭이 모자라 글자를 크게 못 키운다 */
  :root.pt .pod.p1 {
    grid-template-columns: calc(6.5 * var(--u)) 1fr; row-gap: .1em;
    font-size: calc(calc(13 * var(--u)) * var(--s) * var(--pf, 1));
  }
  :root.pt .pod.p1 .pk { grid-column: 1; grid-row: 1; }
  :root.pt .pod.p1 .pn { grid-column: 2; grid-row: 1; }
  :root.pt .pod.p1 .pt { grid-column: 2; grid-row: 2; font-size: .8em; }
  :root.pt .pod.p2, :root.pt .pod.p3 { font-size: calc(calc(7.2 * var(--u)) * var(--s) * var(--pf, 1)); }
  :root.pt .notice .msg { font-size: calc(calc(4.4 * var(--u)) * var(--s)); }
  :root.pt .notice .tag { font-size: calc(calc(2.2 * var(--u)) * var(--s)); }
  :root.pt .divpill { font-size: calc(calc(3.4 * var(--u)) * var(--s)); }
  :root.pt .clock { font-size: calc(calc(3.6 * var(--u)) * var(--s)); }
  :root.pt .conn, :root.pt .waiting .lbl { font-size: calc(calc(1.8 * var(--u)) * var(--s)); }
  :root.pt .waiting .names { font-size: calc(calc(2.6 * var(--u)) * var(--s)); }
  :root.pt .qr canvas { width: calc(calc(11 * var(--u)) * var(--s)); height: calc(calc(11 * var(--u)) * var(--s)); }
  :root.pt .qr .cap b { font-size: calc(calc(2.6 * var(--u)) * var(--s)); }
  :root.pt .qr .cap span { font-size: calc(calc(1.7 * var(--u)) * var(--s)); }

  /* 바닥: 접속상태 + QR 한 줄, 기록 대기는 그 아래 한 줄 */
  :root.pt .foot { grid-template-columns: 1fr auto; gap: calc(1 * var(--u)) 1.4rem; }
  :root.pt .waiting { grid-column: 1 / -1; grid-row: 2; }
  /* 안내 문구를 키웠더니 한 줄에 안 들어감 — 세로 화면에서는 두 줄까지 허용 */
  :root.pt .notice .msg { white-space: normal; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  /* ── 모니터를 눕혀 세운 경우 (회전 모드) ───────
     패널만 90° 돌려 달았는데 신호는 가로 그대로 들어올 때, 화면 내용을 돌려 맞춘다.
     우측 상단 ⟳ 버튼으로 0° → 90° → 270° 순환. 주소에 ?rotate=90 도 가능.
     body 를 통째로 돌리므로 그 안의 position:fixed 요소
     (신기록 전체화면 연출·하단 배너·조작 버튼)도 함께 돌아간다. */
  html.rot { overflow: hidden; }
  html.rot body {
    position: absolute; top: 0; left: 0;
    width: 100vh; height: 100vw;      /* 가로세로를 맞바꾼다 */
    transform-origin: 0 0;
  }
  html.rot.r90 body  { transform: rotate(90deg) translateY(-100%); }
  html.rot.r270 body { transform: rotate(-90deg) translateX(-100%); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>

<main class="board">
  <header class="brand">
    <div class="lockup">
      <svg class="mark" viewBox="0 0 61 55" aria-hidden="true"><path fill="currentColor" d="M60.9 22.34V10.77H25.07L17.89 0H4.51l7.15 10.77H0v11.57h19.36l6.32 9.53H0v11.57h33.37l7.24 10.89h13.5l-7.26-10.89h14.04V31.87H39.14l-6.35-9.53z"/></svg>
      <div class="stack">
        <svg class="wordmark" viewBox="0 0 226 33" role="img" aria-label="DARIMATI">
          <path fill="currentColor" d="M.01 0h14.75c11.71 0 16.59 5.64 16.59 15.78s-6.19 16.76-16.87 16.76H0V0zm9.76 7.97v16.59h4.01c5.7 0 7.87-2.6 7.87-8.79s-2.17-7.81-8.08-7.81h-3.8zM52.59 26.62h-10.9l-1.63 5.91H30.03L40.55 0h13.56l10.52 32.53H54.16zm-8.95-6.99h7.05l-1.08-4.01c-.66-2.44-1.3-4.88-1.85-7.26h-1.09c-.6 2.39-1.25 4.83-1.9 7.26l-1.14 4.01zM79.42 22.5h-3.58v10.03h-9.76V0h14.97c8.57 0 13.34 3.63 13.34 11.44 0 4.77-2.06 7.86-5.53 9.54l7.43 10.95v.6H84.96L79.43 22.5zM75.84 8.13v7.27h4.66c3.2 0 4.23-1.14 4.23-3.64 0-2.66-1.36-3.63-4.39-3.63zM98.38 32.53V0h9.76v32.53zM121.53 32.53h-8.95V0h15.62l2.92 10.84c.54 2 1.41 5.86 2.22 9.81h.71c.75-3.96 1.68-8.02 2.22-10.19L139.04 0h14.42v32.53h-9.77V20.6c0-4.12.22-8.73.38-12.74h-.71c-.97 4.39-2.17 9.38-3.74 14.53l-2.61 8.57h-8.78l-2.49-8.84c-1.52-5.42-2.66-9.98-3.63-14.26h-.71c.11 4.01.11 8.62.11 12.74v11.93zM177.47 26.62h-10.9l-1.63 5.91h-10.03L165.43 0h13.56l10.52 32.53h-10.47zm-8.95-6.99h7.05l-1.08-4.01c-.66-2.44-1.3-4.88-1.85-7.26h-1.09c-.6 2.39-1.25 4.83-1.9 7.26l-1.14 4.01zM185.59 0h26.89v8.95h-8.56v23.59h-9.77V8.95h-8.56zM215.35 32.53V0h9.76v32.53z"/>
        </svg>
        <p class="challenge">셔틀런 챌린지 <em>Shuttle Run Challenge</em></p>
      </div>
    </div>
    <div class="meta">
      <span class="divpill" id="divPill">1부 · 10–12시</span>
      <span class="clock" id="clock">--:--</span>
    </div>
  </header>

  <div class="halves">
    <section class="half" data-sex="M">
      <div class="hlabel"><i class="sexchip">남자</i><em>Men · Top 3</em></div>
      <div class="podium"></div>
    </section>
    <section class="half" data-sex="F">
      <div class="hlabel"><i class="sexchip">여자</i><em>Women · Top 3</em></div>
      <div class="podium"></div>
    </section>
  </div>

  <div class="notice" id="notice" hidden>
    <span class="tag">안내</span>
    <span class="msg" id="noticeMsg"></span>
  </div>

  <footer class="foot">
    <span class="conn" id="conn"><span class="dot"></span><span id="connText">연결 확인 중</span></span>
    <span class="waiting" id="waitBox" hidden><span class="lbl">기록 대기</span><span class="names" id="waitNames"></span></span>
    <span class="qr" id="qrBox" hidden>
      <span class="cap"><b>다리마티</b><span id="qrCap">Scan</span></span>
      <canvas id="qr"></canvas>
    </span>
  </footer>
</main>

<div class="takeover" id="takeover">
  <span class="kicker" id="tkKicker">New Leader</span>
  <span class="big" id="tkName"></span>
  <span class="rec" id="tkTime"></span>
  <span class="sub" id="tkSub"></span>
</div>

<div class="banner" id="banner">
  <span class="k">기록</span><span class="n" id="bnName"></span><span class="t" id="bnTime"></span>
</div>

<div class="ctl">
  <button type="button" id="fontDown">A−</button>
  <button type="button" id="fontUp">A+</button>
  <button type="button" id="rotBtn" title="모니터를 눕혀 세웠을 때 화면을 돌립니다">⟳ 회전</button>
  <button type="button" id="fsBtn">전체화면</button>
</div>

<script src="qrcode.js"></script>
<script>
(function () {
  "use strict";

  var API_URL = "https://script.google.com/macros/s/AKfycbwDiOVHDIHlFRYEgdNJSDohbYrk23cPJtZxBDwiJsYbvoqdWD2Couq0VAWOO6lWa_0-/exec";
  var LKEY = "rextreme_shuttle_v1";
  var VKEY = "rextreme_board_view";
  var DIVS = ["1", "2", "3"];

  var qs = new URLSearchParams(location.search);
  // ?local=1 → 인터넷 없이 같은 브라우저 안에서만 동기화 (에그 먹통 대비)
  var api = qs.get("local") ? "" : (qs.get("api") || API_URL || localStorage.getItem("rex_api"));
  if (qs.get("api")) localStorage.setItem("rex_api", qs.get("api"));

  // 부별 진행 시간대 (8/1 현장 운영표) — 바뀌면 이 줄만 고치면 기록판·운영 양쪽에 반영됩니다.
  var DIV_TIME = { "1": "10–12시", "2": "13–15시", "3": "16–18시" };

  var forcedDiv = qs.get("div");
  var view = { rows: [], cfg: { sort: "asc", live: "1", qr: "" } };
  var shownDiv = forcedDiv || "1";
  var rotateAt = 0, lastSig = "", lastOkAt = null;
  var seen = {};              // 이미 본 기록 (연출 중복 방지)
  var leaderKey = { M: null, F: null };   // 현재 1위 (남/여 각각)
  var primed = false;         // 첫 로딩에는 연출을 띄우지 않음
  var flashKeys = {};

  function two(n) { return n < 10 ? "0" + n : "" + n; }
  /* 기록은 "적은 그대로" 보여줍니다.
     19:79 처럼 뒷자리가 60을 넘는 값도 그대로 써야 해서, 분·초로 환산하지 않고
     앞자리·뒷자리를 통째로 숫자 하나(앞*100 + 뒤)로 저장합니다. 예) 19:79 → 1979
     이렇게 해도 숫자가 작을수록 빠른 기록이라 순위 정렬은 그대로 맞습니다. */
  function fmt(sec) {
    if (sec === null || sec === undefined || sec === "") return "";
    var n = Number(sec); if (isNaN(n)) return "";
    return Math.floor(n / 100) + ":" + two(n % 100);
  }
  function keyOf(r) { return r.d + "|" + r.n + "|" + r.s; }

  /* ── 부 + 성별 ──────────────────────────────
     시상이 매 부마다 남/여 따로라, 운영 페이지가 "부" 값에 성별을 붙여 보냅니다 ("1남", "2여").
     성별이 없는 옛 기록("1")은 어느 쪽에도 안 들어갑니다 — 운영 페이지가 빨간 칩으로 알려줍니다. */
  function divOf(d) { var m = String(d == null ? "" : d).match(/\d+/); return m ? m[0] : "1"; }
  function sexOf(d) {
    var s = String(d == null ? "" : d);
    if (s.indexOf("여") > -1 || /F$/i.test(s)) return "F";
    if (s.indexOf("남") > -1 || /M$/i.test(s)) return "M";
    return "";
  }
  var SEXES = ["M", "F"];
  var SEX_KO = { M: "남자", F: "여자" };

  /* ── 데이터 ────────────────────────────────── */

  function loadLocal() {
    try {
      var p = JSON.parse(localStorage.getItem(LKEY));
      if (!p || !Array.isArray(p.athletes)) return { rows: [], cfg: view.cfg };
      return {
        rows: p.athletes.map(function (a) { return { d: a.div, n: a.name, t: a.time, s: a.seq }; }),
        cfg: p.cfg || view.cfg
      };
    } catch (e) { return { rows: [], cfg: view.cfg }; }
  }

  function setConn(cls, text) {
    var el = document.getElementById("conn");
    el.className = "conn " + cls;
    var stamp = lastOkAt ? " · " + two(lastOkAt.getHours()) + ":" + two(lastOkAt.getMinutes()) : "";
    document.getElementById("connText").textContent = text + stamp;
  }

  // 시트가 알려주는 한국 시각과 이 기기 시계의 차이. TV 시계가 틀려도 화면은 맞습니다.
  var skew = 0;
  var pollDelay = 3000, pollTimer = null;
  function schedulePoll(ms) { clearTimeout(pollTimer); pollTimer = setTimeout(poll, ms); }

  function poll() {
    if (!api) { apply(loadLocal(), false); setConn("", "로컬 모드"); schedulePoll(3000); return; }
    fetch(api + (api.indexOf("?") > -1 ? "&" : "?") + "a=board&_=" + new Date().getTime(), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.ok) throw 0;
        if (j.ts) { var t = Date.parse(j.ts); if (!isNaN(t)) skew = t - Date.now(); }
        apply(j, true);
        tick();
        pollDelay = 3000;
        schedulePoll(pollDelay);
      })
      .catch(function () {
        setConn("bad", lastOkAt ? "연결 끊김 · 마지막" : "연결 실패");
        pollDelay = Math.min(pollDelay * 2, 30000);   // 계속 두드리지 않고 간격을 늘립니다
        schedulePoll(pollDelay);
      });
  }

  // 한국 시각 (UTC+9). skew가 0이면 이 기기 시계를 그대로 씁니다.
  function kst() { return new Date(Date.now() + skew + 9 * 3600 * 1000); }

  function apply(data, ok) {
    view.rows = data.rows || [];
    if (data.cfg) {
      var before = view.cfg.qr;
      view.cfg = data.cfg;
      if (view.cfg.qr !== before) drawQR();
      setNotice();
    }
    if (ok) { lastOkAt = new Date(); setConn("ok", "실시간"); }
    detectNew();
    var sig = JSON.stringify(view.rows) + "|" + shownDiv;
    if (sig !== lastSig) { lastSig = sig; render(); }
    else { var d = pickDiv(); if (d !== shownDiv) { shownDiv = d; render(); } }
  }

  /* ── 새 기록 감지 → 연출 ───────────────────── */

  function detectNew() {
    var fresh = [];
    view.rows.forEach(function (r) {
      if (r.t === null || r.t === undefined || r.t === "") return;
      var k = keyOf(r);
      if (seen[k] !== r.t) { if (primed && seen[k] === undefined || (primed && seen[k] !== r.t)) fresh.push(r); seen[k] = r.t; }
    });

    // 1위는 남/여 각각 따로 — 어느 쪽이든 새 1위가 나오면 전체화면 연출
    var d = pickDiv();
    var tops = {}, keys = {};
    SEXES.forEach(function (sx) {
      var t = ranked(d, sx)[0];
      tops[sx] = t ? t.a : null;
      keys[sx] = t ? keyOf(t.a) + "@" + t.a.t : null;
    });

    if (!primed) { primed = true; leaderKey = keys; return; }

    var changed = SEXES.filter(function (sx) { return keys[sx] && keys[sx] !== leaderKey[sx]; });
    if (changed.length) {
      leaderKey = keys;
      showTakeover(tops[changed[0]]);
      fresh.forEach(function (r) { flashKeys[keyOf(r)] = 1; });
      return;
    }
    leaderKey = keys;

    if (fresh.length) {
      var last = fresh[fresh.length - 1];
      fresh.forEach(function (r) { flashKeys[keyOf(r)] = 1; });
      showBanner(last);
    }
  }

  var tkTimer, bnTimer;
  function showTakeover(a) {
    var el = document.getElementById("takeover");
    var sx = sexOf(a.d);
    document.getElementById("tkName").textContent = a.n;
    document.getElementById("tkTime").textContent = fmt(a.t);
    document.getElementById("tkKicker").textContent = (SEX_KO[sx] || "") + " 새 1위 · New Leader";
    document.getElementById("tkSub").textContent =
      divOf(a.d) + "부 " + (SEX_KO[sx] || "") + " · DARIMATI 셔틀런 챌린지";
    el.dataset.show = "true";
    clearTimeout(tkTimer);
    tkTimer = setTimeout(function () { el.dataset.show = "false"; }, 5000);
  }

  function showBanner(a) {
    var el = document.getElementById("banner");
    var r = ranked(divOf(a.d), sexOf(a.d)).filter(function (x) { return keyOf(x.a) === keyOf(a); })[0];
    document.getElementById("bnName").textContent =
      a.n + " " + (SEX_KO[sexOf(a.d)] || "") + (r ? "  " + r.rank + "위" : "");
    document.getElementById("bnTime").textContent = fmt(a.t);
    el.dataset.show = "true";
    clearTimeout(bnTimer);
    bnTimer = setTimeout(function () { el.dataset.show = "false"; }, 4000);
  }

  /* ── 순위 ──────────────────────────────────── */

  function asc() { return String(view.cfg.sort || "asc") !== "desc"; }

  function ranked(div, sex) {
    var up = asc();
    var done = view.rows
      .filter(function (a) {
        return divOf(a.d) === div && sexOf(a.d) === sex &&
          a.t !== null && a.t !== undefined && a.t !== "";
      })
      .sort(function (a, b) { return up ? (a.t - b.t || a.s - b.s) : (b.t - a.t || a.s - b.s); });
    var rank = 0, prev = null, out = [];
    done.forEach(function (a, i) {
      if (a.t !== prev) { rank = i + 1; prev = a.t; }
      out.push({ a: a, rank: rank });
    });
    return out;
  }
  function pendingOf(div) {
    return view.rows.filter(function (a) {
      return divOf(a.d) === div && SEXES.indexOf(sexOf(a.d)) > -1 &&
        (a.t === null || a.t === undefined || a.t === "");
    });
  }

  // 시계로 지금 진행 중인 부를 판단합니다 (1부 ~12:59 / 2부 ~15:59 / 3부 그 이후)
  function divByClock() {
    var h = kst().getUTCHours();
    if (h < 13) return "1";
    if (h < 16) return "2";
    return "3";
  }

  function pickDiv() {
    if (forcedDiv) return forcedDiv;
    var live = String(view.cfg.live || "1");
    if (live === "auto") return divByClock();
    if (live !== "rotate") return DIVS.indexOf(live) > -1 ? live : "1";
    var have = DIVS.filter(function (d) { return view.rows.some(function (r) { return divOf(r.d) === d; }); });
    if (!have.length) return "1";
    var now = new Date().getTime();
    if (now > rotateAt) { rotateAt = now + 20000; shownDiv = have[(have.indexOf(shownDiv) + 1) % have.length]; }
    return have.indexOf(shownDiv) > -1 ? shownDiv : have[0];
  }

  /* ── 렌더 ──────────────────────────────────── */

  // 남/여 두 칸의 화면 요소를 미리 잡아둡니다
  var halves = {};
  SEXES.forEach(function (sx) {
    var el = document.querySelector('.half[data-sex="' + sx + '"]');
    halves[sx] = { box: el, podium: el.querySelector(".podium") };
  });

  function render() {
    shownDiv = pickDiv();
    var wait = pendingOf(shownDiv);

    document.getElementById("divPill").textContent =
      shownDiv + "부" + (DIV_TIME[shownDiv] ? " · " + DIV_TIME[shownDiv] : "");

    SEXES.forEach(function (sx) { renderHalf(sx, ranked(shownDiv, sx), wait); });
    flashKeys = {};

    // 기록 대기 (남·여 합쳐서 한 줄)
    var wb = document.getElementById("waitBox");
    wb.hidden = wait.length === 0;
    document.getElementById("waitNames").textContent = wait.map(function (a) { return a.n; }).join("  ·  ");

    autofit();
  }

  // 시상 대상인 1·2·3위만 큼직하게. 4위 아래는 화면에 띄우지 않습니다.
  function renderHalf(sx, rows, waitAll) {
    var h = halves[sx];
    var wait = waitAll.filter(function (a) { return sexOf(a.d) === sx; });
    var top3 = rows.slice(0, 3);
    var box = h.podium;
    box.innerHTML = "";

    if (!top3.length) {
      var p = document.createElement("p");
      p.className = "empty";
      p.textContent = wait.length ? "등록 " + wait.length + "명 · 첫 기록을 기다립니다" : "누구나 참여 · 부스에서 신청";
      box.appendChild(p);
      return;
    }
    top3.forEach(function (r, i) {
      var k = keyOf(r.a);
      var el = document.createElement("div");
      el.className = "pod p" + (i + 1) + (flashKeys[k] ? " flash" : "");
      el.innerHTML = "<span class='pk'>" + r.rank + "</span><span class='pn'></span><span class='pt'>" + fmt(r.a.t) + "</span>";
      el.querySelector(".pn").textContent = r.a.n;
      box.appendChild(el);
    });
  }

  // 세 줄이 위아래로 넘치거나 긴 이름이 옆으로 잘릴 때, 그 칸의 글자만 줄입니다
  function autofit() {
    function put(v) { SEXES.forEach(function (sx) { halves[sx].box.style.setProperty("--pf", v); }); }
    function anyOver() { return SEXES.some(function (sx) { return podOverflows(halves[sx]); }); }
    var f = 1, guard = 0;
    put(f);
    while (anyOver() && f > 0.4 && guard++ < 30) {
      f = Math.round((f - 0.04) * 100) / 100;
      put(f);
    }
  }

  function podOverflows(h) {
    if (h.podium.scrollHeight > h.podium.clientHeight + 1) return true;
    var names = h.podium.querySelectorAll(".pn");
    for (var i = 0; i < names.length; i++) {
      if (names[i].scrollWidth > names[i].clientWidth + 1) return true;   // 이름이 …으로 잘리는 중
    }
    return false;
  }

  /* ── 하단 안내 롤링 배너 ───────────────────── */

  // 운영 페이지에서 안 바꾸면 이 문구가 나옵니다. 여러 개면 6초마다 돌아갑니다.
  var DEFAULT_NOTICE = [
    "각 시간대별 행사가 종료되면 결과와 경품 안내를 개별 연락드립니다",
    "대기줄 입구의 QR코드로 선수 정보를 먼저 제출해 주세요",
    "시상은 매 부마다 남자 · 여자 각각 진행합니다"
  ];
  var noticeList = [], noticeIdx = 0, noticeTimer = null;

  function setNotice() {
    var raw = String(view.cfg.notice === undefined ? "" : view.cfg.notice).trim();
    var list = raw
      ? raw.split("|").map(function (s) { return s.trim(); }).filter(Boolean)
      : DEFAULT_NOTICE;
    if (JSON.stringify(list) === JSON.stringify(noticeList)) return;

    noticeList = list; noticeIdx = 0;
    clearInterval(noticeTimer);
    var box = document.getElementById("notice");
    box.hidden = list.length === 0;
    if (!list.length) { autofit(); return; }
    document.getElementById("noticeMsg").textContent = list[0];
    if (list.length > 1) noticeTimer = setInterval(rollNotice, 6000);
    autofit();
  }

  function rollNotice() {
    var el = document.getElementById("noticeMsg");
    el.classList.add("out");
    setTimeout(function () {
      noticeIdx = (noticeIdx + 1) % noticeList.length;
      el.style.transition = "none";
      el.classList.remove("out");
      el.classList.add("below");
      el.textContent = noticeList[noticeIdx];
      void el.offsetWidth;              // 아래에서 올라오도록 위치를 먼저 잡습니다
      el.style.transition = "";
      el.classList.remove("below");
    }, 400);
  }

  /* ── QR ────────────────────────────────────── */

  function drawQR() {
    var box = document.getElementById("qrBox");
    var url = (view.cfg.qr || "").trim();
    if (!url || typeof qrcode === "undefined") { box.hidden = true; return; }
    try {
      var q = qrcode(0, "M");
      q.addData(url);
      q.make();
      var n = q.getModuleCount(), px = 6, cv = document.getElementById("qr");
      cv.width = cv.height = n * px;
      var ctx = cv.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = "#000";
      for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) ctx.fillRect(c * px, r * px, px, px);
      document.getElementById("qrCap").textContent = "여기서 확인";
      box.hidden = false;
    } catch (e) { box.hidden = true; }
  }

  /* ── 화면 설정 ─────────────────────────────── */

  var vs = { scale: 1, rot: 0 };
  try { vs = JSON.parse(localStorage.getItem(VKEY)) || vs; } catch (e) {}
  if (typeof vs.scale !== "number") vs.scale = 1;
  function applyScale() { document.documentElement.style.setProperty("--s", vs.scale); autofit(); }
  function saveView() { try { localStorage.setItem(VKEY, JSON.stringify(vs)); } catch (e) {} }

  /* 화면 회전 — 모니터를 물리적으로 눕혀 세웠을 때 내용을 돌려 맞춘다.
     한 번 정해두면 이 기기에 저장되므로 당일 아침에 한 번만 맞추면 된다. */
  var ROTS = [0, 90, 270];
  if (qs.get("rotate") !== null) vs.rot = Number(qs.get("rotate"));
  if (ROTS.indexOf(vs.rot) < 0) vs.rot = 0;

  // 화면이 세로로 길쭉한가? 회전 모드면 가로세로가 뒤바뀐 걸 감안한다.
  function setPortrait() {
    var portrait = vs.rot !== 0
      ? window.innerWidth >= window.innerHeight
      : window.innerHeight > window.innerWidth;
    document.documentElement.classList.toggle("pt", portrait);
  }
  function applyRot() {
    var h = document.documentElement;
    h.classList.toggle("rot", vs.rot !== 0);
    h.classList.toggle("r90", vs.rot === 90);
    h.classList.toggle("r270", vs.rot === 270);
    setPortrait();
    autofit();
  }
  document.getElementById("rotBtn").addEventListener("click", function () {
    vs.rot = ROTS[(ROTS.indexOf(vs.rot) + 1) % ROTS.length];
    applyRot(); saveView();
  });

  document.getElementById("fontUp").addEventListener("click", function () {
    vs.scale = Math.min(1.6, Math.round((vs.scale + 0.05) * 100) / 100); applyScale(); saveView();
  });
  document.getElementById("fontDown").addEventListener("click", function () {
    vs.scale = Math.max(0.6, Math.round((vs.scale - 0.05) * 100) / 100); applyScale(); saveView();
  });
  document.getElementById("fsBtn").addEventListener("click", function () {
    if (!document.fullscreenElement) { (document.documentElement.requestFullscreen || function () {}).call(document.documentElement); }
    else { document.exitFullscreen(); }
  });

  function tick() {
    var d = kst();
    document.getElementById("clock").textContent = two(d.getUTCHours()) + ":" + two(d.getUTCMinutes());
  }

  window.addEventListener("storage", function (e) { if (e.key === LKEY) poll(); });
  window.addEventListener("resize", function () { setPortrait(); autofit(); });

  applyRot(); applyScale(); setNotice(); tick(); setInterval(tick, 10000);
  poll();
})();
</script>
</body>
</html>
