<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>REXTREME 부스 안내</title>
<style>
  :root {
    --ground: #06080a;
    --panel: #0e1316;
    --rule-strong: #2b373e;
    --text: #f2f6f8;
    --muted: #7d8c95;
    --signal: #ff5a28;
    --font-ui: system-ui, -apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    --font-num: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    /* 기록판과 같은 단위 — 화면 짧은 변의 1%. 가로로 두든 눕혀 세우든 글자 크기가 같다. */
    --u: 1vmin;
    --s: 1;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--text);
    font-family: var(--font-ui); -webkit-font-smoothing: antialiased; overflow: hidden;
    /* 한국어는 낱말 안에서 줄이 끊기면(“달립니 / 다”) 멀리서 읽는 속도가 확 떨어진다.
       띄어쓰기에서만 끊기게 한다. */
    word-break: keep-all;
  }

  /* TV 는 화면 가장자리를 잘라 먹는 기종이 있다(오버스캔). 안전 여백을 둔다.
     더 잘리면 주소에 ?inset=5 처럼 % 를 올리면 된다. */
  .board {
    height: 100%; display: flex; flex-direction: column;
    padding: var(--inset, 2vmin) calc(clamp(1rem, 2.6vw, 3rem) + var(--inset, 2vmin));
  }

  /* ── 브랜드 밴드 ─────────────────────────────── */
  .brand {
    display: flex; align-items: center; gap: 2rem;
    padding: calc(1.4 * var(--u)) 0 calc(1.6 * var(--u)); border-bottom: 1px solid var(--rule-strong);
  }
  .lockup { display: flex; align-items: center; gap: clamp(.8rem, 1.8vw, 1.8rem); min-width: 0; }
  .mark { height: calc(8 * var(--u) * var(--s)); width: auto; color: var(--signal); flex: none; }
  .challenge {
    margin: 0; display: flex; flex-direction: column; align-items: flex-start; gap: calc(.7 * var(--u));
    font-size: calc(6.4 * var(--u) * var(--s)); font-weight: 800; letter-spacing: -.035em; line-height: 1;
  }
  .challenge em {
    font-style: normal; font-family: var(--font-num); font-weight: 700;
    font-size: .34em; letter-spacing: .18em; color: var(--signal); text-transform: uppercase;
  }

  /* ── 본문: 안내 문구 한 장 ────────────────────
     멀리서 한 번에 읽히는 게 전부인 화면이다. 줄을 손으로 끊어 두고(=읽는 순서를 고정),
     화면에 안 들어가면 autofit 이 세 줄을 같은 비율로 줄인다. */
  .promo {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    gap: calc(2.2 * var(--u)); padding: calc(2 * var(--u)) 0;
  }
  .promo p { margin: 0; line-height: 1.16; letter-spacing: -.035em; }

  /* 앞의 두 줄 = 무엇을 하면 되는지 */
  .promo .p1, .promo .p2 {
    font-size: calc(8 * var(--u) * var(--s) * var(--pf, 1));
    font-weight: 700; color: var(--text);
  }
  .promo .p1 b, .promo .p2 b { color: var(--signal); font-weight: 800; }

  /* 맨 윗줄 = 붙잡는 한마디. 멀리서 이것만 보고 다가오므로 제일 크게. */
  .promo .p3 {
    margin-bottom: calc(1.4 * var(--u));
    font-size: calc(17 * var(--u) * var(--s) * var(--pf, 1));
    font-weight: 800; color: var(--signal);
    padding: calc(1.6 * var(--u)) calc(4 * var(--u));
    border: calc(.35 * var(--u)) solid var(--signal); border-radius: calc(1.4 * var(--u));
    background: linear-gradient(180deg, rgba(255,90,40,.18), rgba(255,90,40,.04));
    animation: glow 2.4s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 calc(2 * var(--u)) rgba(255,90,40,.25); }
    50%      { box-shadow: 0 0 calc(5 * var(--u)) rgba(255,90,40,.60); }
  }

  /* 눕혀 세운 세로 화면 — 폭이 좁으므로 크게 잡아두고 autofit 에 맡긴다 */
  :root.pt .promo .p1, :root.pt .promo .p2 { font-size: calc(11 * var(--u) * var(--s) * var(--pf, 1)); }
  :root.pt .promo .p3 { font-size: calc(22 * var(--u) * var(--s) * var(--pf, 1)); }

  /* ── 모니터를 눕혀 세운 경우 (회전 모드) ───────
     기록판과 같은 방식. 우측 상단 ⟳ 또는 주소에 ?rotate=90 */
  html.rot { overflow: hidden; }
  html.rot body { position: absolute; top: 0; left: 0; width: 100vh; height: 100vw; transform-origin: 0 0; }
  html.rot.r90 body  { transform: rotate(90deg) translateY(-100%); }
  html.rot.r270 body { transform: rotate(-90deg) translateX(-100%); }

  .ctl { position: fixed; right: .7rem; top: .7rem; display: flex; gap: .4rem; opacity: .92; z-index: 70; }
  .ctl:hover, .ctl:focus-within { opacity: 1; }
  .ctl button { appearance: none; background: rgba(20,26,31,.92); border: 1px solid var(--rule-strong); color: var(--text);
    font-family: var(--font-ui); font-size: .95rem; font-weight: 700; padding: .6rem 1rem; border-radius: 6px; cursor: pointer;
    backdrop-filter: blur(6px); }
  button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>

<main class="board">
  <header class="brand">
    <div class="lockup">
      <svg class="mark" viewBox="0 0 61 55" aria-hidden="true"><path fill="currentColor" d="M60.9 22.34V10.77H25.07L17.89 0H4.51l7.15 10.77H0v11.57h19.36l6.32 9.53H0v11.57h33.37l7.24 10.89h13.5l-7.26-10.89h14.04V31.87H39.14l-6.35-9.53z"/></svg>
      <p class="challenge">부스 안내 <em>Darimati</em></p>
    </div>
  </header>

  <!-- 문구를 바꾸려면 이 세 줄만 고치면 됩니다. 줄을 나눈 위치가 곧 읽는 순서입니다. -->
  <section class="promo" id="promo">
    <p class="p3">극강의 접지력!</p>
    <p class="p1">다리마티 <b>하이브리드 러닝화</b> 체험해보시고</p>
    <p class="p2"><b>선물</b> 받아가세요</p>
  </section>
</main>

<div class="ctl">
  <button type="button" id="fontDown">A−</button>
  <button type="button" id="fontUp">A+</button>
  <button type="button" id="rotBtn" title="모니터를 눕혀 세웠을 때 화면을 돌립니다">⟳ 회전</button>
  <button type="button" id="fsBtn">전체화면</button>
</div>

<script>
(function () {
  "use strict";

  var VKEY = "rextreme_board_view";      // 기록판과 같은 키 — 회전·글자 크기 설정을 공유
  var qs = new URLSearchParams(location.search);

  // TV가 화면 가장자리를 잘라 먹으면(오버스캔) ?inset=5 처럼 여백 %를 올린다
  (function () {
    var v = Number(qs.get("inset"));
    if (!isNaN(v) && v >= 0 && v <= 15) document.documentElement.style.setProperty("--inset", v + "vmin");
  })();

  /* 문구가 화면 밖으로 넘치면 세 줄을 같은 비율로 함께 줄인다.
     따로 줄이면 줄마다 글자 크기가 어긋나 보인다. */
  var promo = document.getElementById("promo");
  function autofit() {
    var root = document.documentElement;
    function over() {
      if (promo.scrollHeight > promo.clientHeight + 2) return true;   // 위아래로 넘침
      return promo.scrollWidth > promo.clientWidth + 1;               // 옆으로 잘림
    }
    var f = 1, guard = 0;
    root.style.setProperty("--pf", f);
    while (over() && f > 0.3 && guard++ < 50) {
      f = Math.round((f - 0.03) * 100) / 100;
      root.style.setProperty("--pf", f);
    }
  }

  /* ── 화면 설정 (기록판과 같은 조작) ────────── */

  var vs = { scale: 1, rot: 0 };
  try { vs = JSON.parse(localStorage.getItem(VKEY)) || vs; } catch (e) {}
  if (typeof vs.scale !== "number") vs.scale = 1;
  var ROTS = [0, 90, 270];
  if (qs.get("rotate") !== null) vs.rot = Number(qs.get("rotate"));
  if (ROTS.indexOf(vs.rot) < 0) vs.rot = 0;

  function saveView() { try { localStorage.setItem(VKEY, JSON.stringify(vs)); } catch (e) {} }
  function applyScale() { document.documentElement.style.setProperty("--s", vs.scale); autofit(); }
  function setPortrait() {
    var portrait = vs.rot !== 0 ? window.innerWidth >= window.innerHeight : window.innerHeight > window.innerWidth;
    document.documentElement.classList.toggle("pt", portrait);
  }
  function applyRot() {
    var h = document.documentElement;
    h.classList.toggle("rot", vs.rot !== 0);
    h.classList.toggle("r90", vs.rot === 90);
    h.classList.toggle("r270", vs.rot === 270);
    setPortrait();
    autofit();
  }

  document.getElementById("rotBtn").addEventListener("click", function () {
    vs.rot = ROTS[(ROTS.indexOf(vs.rot) + 1) % ROTS.length]; applyRot(); saveView();
  });
  document.getElementById("fontUp").addEventListener("click", function () {
    vs.scale = Math.min(1.6, Math.round((vs.scale + 0.05) * 100) / 100); applyScale(); saveView();
  });
  document.getElementById("fontDown").addEventListener("click", function () {
    vs.scale = Math.max(0.6, Math.round((vs.scale - 0.05) * 100) / 100); applyScale(); saveView();
  });
  document.getElementById("fsBtn").addEventListener("click", function () {
    if (!document.fullscreenElement) { (document.documentElement.requestFullscreen || function () {}).call(document.documentElement); }
    else { document.exitFullscreen(); }
  });
  window.addEventListener("resize", function () { setPortrait(); autofit(); });

  applyRot(); applyScale();
})();
</script>
</body>
</html>
