<!-- 향동 창고 악세사리 재고 스냅샷. 손으로 고치는 정적 페이지 (구글 재고 시트와 자동 연동 아님).
     숫자를 바꿀 땐 아래 표만 고치고 '업데이트' 날짜도 같이 바꾼다. -->
<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>악세사리 재고 - 향동</title>
<style>
  :root{--paper:#FAFAF8;--surface:#FFF;--ink:#15171B;--muted:#767D89;--line:#E3E2DC;--hd:#97671D;--hd-bg:#F6EEDC;--warn:#B03A21;--warn-bg:#F9E4DD;
        --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif}
  @media (prefers-color-scheme:dark){:root{--paper:#101215;--surface:#171A1F;--ink:#ECEEF1;--muted:#848B97;--line:#2A2E36;--hd:#DFA94C;--hd-bg:#2C2517;--warn:#EF8163;--warn-bg:#331A13}}
  *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
  main{max-width:720px;margin:0 auto;padding:28px 18px 48px}
  .eyebrow{color:var(--hd);font-size:13px;font-weight:600;letter-spacing:.04em}
  h1{font-size:24px;margin:4px 0 6px} .meta{color:var(--muted);font-size:13px;margin-bottom:18px}
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;table-layout:fixed}
  th,td{padding:14px 6px;text-align:center;border-right:1px solid var(--line)} th:last-child,td:last-child{border-right:0}
  th{background:var(--hd-bg);font-size:15px;font-weight:600} td{font-size:22px;font-variant-numeric:tabular-nums;font-weight:600;border-top:1px solid var(--line)}
  td.low{color:var(--warn);background:var(--warn-bg)}
  .note{color:var(--muted);font-size:13px;margin-top:14px;line-height:1.6}
</style></head><body><main>
<div class="eyebrow">다리마티 · 창고</div>
<h1>악세사리 재고 - 향동</h1>
<div class="meta">업데이트 2026-11-20 · 수기 입력 스냅샷</div>
<table>
  <tr><th>가방</th><th>벨트</th><th>물통</th><th>모자</th><th>타월</th></tr>
  <tr><td>23</td><td>200</td><td class="low">7</td><td>437</td><td>145</td></tr>
</table>
<p class="note">10개 미만은 빨간색으로 표시돼요.<br>이 페이지는 손으로 적은 숫자예요. 실시간 재고는 출고 대시보드(구글 재고 시트)를 기준으로 봐 주세요.</p>
</main></body></html>
