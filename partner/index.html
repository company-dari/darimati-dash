<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>DARIMATI · 파트너 정산</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{ --ink:#16181a; --sub:#6b7480; --line:#e7e9ec; --bg:#fff; --point:#6e7c88; --warn:#8a6d1f; --warnbg:#fdf6e3; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
       font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:40px 16px 80px}
  .eyebrow{font-size:12px;letter-spacing:.18em;color:var(--sub);text-transform:uppercase}
  h1{font-size:28px;margin:6px 0 2px;letter-spacing:-.02em}
  .sub{color:var(--sub);font-size:14px;margin:0 0 28px}
  .hero{border:1px solid var(--line);border-radius:14px;padding:26px 22px;margin-bottom:14px}
  .hero .label{font-size:13px;color:var(--sub);margin-bottom:6px}
  .hero .num{font-size:42px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
  .hero .num small{font-size:20px;font-weight:600;margin-left:3px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
  .cell{border:1px solid var(--line);border-radius:12px;padding:16px 14px}
  .cell .k{font-size:12px;color:var(--sub);margin-bottom:4px}
  .cell .v{font-size:19px;font-weight:600;letter-spacing:-.02em}
  h2{font-size:15px;margin:0 0 10px;letter-spacing:-.01em}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-weight:500;color:var(--sub);font-size:12px;padding:0 0 8px;border-bottom:1px solid var(--line)}
  td{padding:12px 0;border-bottom:1px solid var(--line);vertical-align:top}
  td.amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:#f1f3f5;color:var(--sub)}
  .tag.off{background:#fdecec;color:#9b2c2c}
  .empty{border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--sub);font-size:14px}
  .foot{margin-top:28px;font-size:12px;color:var(--sub);line-height:1.8}
  .stale{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:18px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">DARIMATI</div>
  <h1 id="name">파트너 정산</h1>
  <p class="sub" id="sub">불러오는 중…</p>

  <div class="stale" id="stale"></div>

  <div id="body" hidden>
    <div class="hero">
      <div class="label">정산 예정 금액</div>
      <div class="num" id="fee">0<small>원</small></div>
    </div>

    <div class="grid">
      <div class="cell"><div class="k">판매</div><div class="v" id="cnt">0건</div></div>
      <div class="cell"><div class="k">매출</div><div class="v" id="rev">0</div></div>
      <div class="cell"><div class="k">수수료율</div><div class="v" id="rate">10%</div></div>
    </div>

    <h2>주문 내역</h2>
    <div id="orders"></div>

    <p class="foot">
      데이터 기준: <b id="asof">—</b><br>
      · 취소·환불된 주문은 매출과 정산에서 빠집니다<br>
      · 주문은 다리마티 공식몰 결제 기준이며, 매일 자동으로 갱신됩니다<br>
      · 문의는 다리마티 담당자에게 연락 주세요
    </p>
  </div>

  <div class="empty" id="nope" hidden>
    주소가 올바르지 않습니다.<br>다리마티에서 받으신 링크를 그대로 열어주세요.
  </div>
</div>

<script>
(function(){
  var t = new URLSearchParams(location.search).get('t') || '';
  var $ = function(id){ return document.getElementById(id); };
  var won = function(n){ return (n||0).toLocaleString('ko-KR'); };

  if(!/^[A-Za-z0-9_-]{8,}$/.test(t)){ $('sub').hidden = true; $('nope').hidden = false; return; }

  fetch('data/' + encodeURIComponent(t) + '.json?v=' + Date.now())
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){
      document.title = (d.표시이름 || '파트너') + ' · DARIMATI 정산';
      $('name').textContent = (d.표시이름 || '파트너') + ' 정산 현황';
      $('sub').textContent = 'BR-001 하이브리드 · 전용 링크 판매분';
      $('fee').innerHTML = won(d.수수료) + '<small>원</small>';
      $('cnt').textContent = (d.판매건수 || 0) + '건';
      $('rev').textContent = won(d.매출);
      $('rate').textContent = (d.수수료율 || 10) + '%';
      $('asof').textContent = d.기준시각 || '—';

      var rows = d.주문 || [];
      if(!rows.length){
        $('orders').innerHTML = '<div class="empty">아직 주문이 없습니다.<br>전용 링크로 첫 주문이 들어오면 여기에 바로 표시됩니다.</div>';
      } else {
        var html = '<table><thead><tr><th>주문일</th><th>주문</th><th style="text-align:right">금액</th></tr></thead><tbody>';
        rows.forEach(function(o){
          var off = (o.상태 === '환불');
          html += '<tr><td>' + o.주문일 + '</td><td>' + (o.주문번호 || '') +
                  (off ? ' <span class="tag off">환불</span>' : '') +
                  '<br><span class="tag">' + (o.상품 || '') + '</span></td>' +
                  '<td class="amt">' + (off ? '—' : won(Math.round(o.금액))) + '</td></tr>';
        });
        $('orders').innerHTML = html + '</tbody></table>';
      }

      // 숫자가 멀쩡해 보이는데 실은 옛날 것 — 이게 가장 위험한 고장이라 화면에서 먼저 알린다
      var asof = new Date((d.기준시각 || '').replace(/-/g,'/'));
      if(asof && (Date.now() - asof.getTime()) > 36*3600*1000){
        var s = $('stale');
        s.textContent = '⚠️ 이 숫자는 ' + (d.기준시각) + ' 기준입니다. 자동 갱신이 멈춘 것 같으니 다리마티에 알려주세요.';
        s.style.display = 'block';
      }
      $('body').hidden = false;
    })
    .catch(function(){ $('sub').hidden = true; $('nope').hidden = false; });
})();
</script>
</body>
</html>
