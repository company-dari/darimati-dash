<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>다리마티</title>
<style>
  html,body{height:100%;margin:0}
  body{background:#0e1013;color:#e9ecf1;display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif}
  .w{text-align:center;padding:24px;max-width:340px;opacity:0;transition:opacity .2s}
  .w.on{opacity:1}
  .m{font-weight:800;letter-spacing:.22em;font-size:13px;color:#98a0ad;margin-bottom:18px}
  .s{width:26px;height:26px;margin:0 auto;border:2px solid #262b33;border-top-color:#e9ecf1;
     border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  h1{font-size:16px;margin:14px 0 6px}
  p{font-size:13px;color:#98a0ad;line-height:1.6;margin:0 0 18px}
  a{display:inline-block;padding:11px 20px;background:#e9ecf1;color:#0e1013;border-radius:10px;
    text-decoration:none;font-weight:700;font-size:14px}
</style>
</head>
<body>
<div class="w" id="w">
  <div class="m">DARIMATI</div>
  <div class="s" id="sp"></div>
  <div id="err" hidden>
    <h1>페이지를 찾지 못했습니다</h1>
    <p>주소가 바뀌었거나 준비 중인 QR입니다.<br>홈에서 원하시는 내용을 찾아보세요.</p>
    <a href="https://www.darimati.us">다리마티 홈으로</a>
  </div>
</div>

<script src="links.js?v=722d455a70"></script>
<script>
/* 인쇄된 QR이 가리키는 고정 주소.
   여기서 하는 일은 하나뿐이다 — 링크표에 적힌 "지금의 목적지"로 손님을 넘긴다.

   목적지를 찾는 순서(앞의 것이 실패하면 다음으로 내려간다):
     1) 구글시트 실시간 조회   ← 방금 바꾼 목적지가 즉시 반영되는 경로
     2) 이 기기에 남은 캐시    ← 구글이 느리거나 잠깐 죽었을 때
     3) 배포 때 구워둔 스냅샷  ← 첫 방문자도 구제되는 마지막 보루
   셋 다 실패해야만 안내 화면을 보여준다. */

(function () {
  var CFG = window.QR || {};
  var API = CFG.api || "";
  var SNAP = CFG.map || {};
  var HOME = "https://www.darimati.us";
  var CK = "qr.cache";

  /* 실시간 조회를 얼마나 기다릴지. 실측 응답이 0.32초라 0.7초면 거의 항상 실시간 값이 이긴다.
     이게 곧 "대시보드에서 목적지를 바꾸면 즉시 반영된다"는 약속이다.
     신호가 나쁘면 0.7초에 저장된 값으로 넘어가므로 부스에서 손님을 세워두지 않는다.
     ⚠️ 이 값을 0 으로 만들거나 스냅샷 우선으로 바꾸면 목적지 교체가 배포 전까지 안 먹는다 —
     당일 사고 때 1초 복구가 불가능해지므로 그렇게 하지 말 것. */
  var TIMEOUT = 700;

  var code = (function () {
    var m = location.search.match(/[?&]code=([^&]+)/) || location.search.match(/[?&]c=([^&]+)/);
    if (m) return decodeURIComponent(m[1]).trim().toLowerCase();
    return location.hash.replace(/^#/, "").trim().toLowerCase();
  })();

  var done = false;
  function go(url) {
    if (done || !url) return;
    done = true;
    location.replace(url);
  }

  // 0.4초 안에 넘어가면 화면을 아예 안 보여준다(깜빡임 방지).
  setTimeout(function () { if (!done) document.getElementById("w").className = "w on"; }, 400);

  function fail() {
    if (done) return;
    done = true;
    document.getElementById("w").className = "w on";
    document.getElementById("sp").hidden = true;
    document.getElementById("err").hidden = false;
  }

  function cache(get, url) {
    try {
      var c = JSON.parse(localStorage.getItem(CK) || "{}");
      if (get) return c[code];
      c[code] = url;
      localStorage.setItem(CK, JSON.stringify(c));
    } catch (e) {}
  }

  /* 0.7초 안에 구글이 답을 못 준 경우.
     ① 캐시/스냅샷에 답이 있으면 즉시 보낸다(빠른 길, 예전과 동일).
     ② 없으면 여기서 포기하지 않는다 — 방금 등록한 QR이 바로 이 경우다.
        브라우저가 붙들고 있는 links.js 가 옛 버전이면 새 코드가 안 들어 있고,
        그 상태로 fail() 을 부르면 멀쩡한 QR이 "페이지를 찾지 못했습니다"가 된다.
        (2026-08-03 F45 지점 QR 3개가 실제로 이렇게 죽었다.)
        → 스냅샷을 캐시 무시하고 새로 받아보고, 그래도 없으면 느린 구글을
          LAST 까지 계속 기다린다. 안내 화면은 둘 다 실패했을 때만 띄운다. */
  function backup() {
    if (done) return;
    var u = cache(true) || SNAP[code];
    if (u) { go(u); return; }
    if (!code) { go(HOME); return; }

    fetch("links.js?_=" + new Date().getTime(), { cache: "no-store" })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        // 파일 안의 map 만 안전하게 뽑아 쓴다(스크립트를 실행하지 않는다).
        var m = t.match(/"([a-z0-9-]+)"\s*:\s*"(https?:\/\/[^"]+)"/gi) || [];
        for (var i = 0; i < m.length; i++) {
          var kv = m[i].match(/"([a-z0-9-]+)"\s*:\s*"(https?:\/\/[^"]+)"/i);
          if (kv && kv[1].toLowerCase() === code) { go(kv[2]); return; }
        }
      })
      .catch(function () {});
  }

  if (!code) { go(HOME); return; }

  var device = /iPad|Tablet/i.test(navigator.userAgent) ? "태블릿"
             : /Mobi|Android|iPhone/i.test(navigator.userAgent) ? "모바일" : "PC";

  if (!API) { backup(); return; }

  var timer = setTimeout(backup, TIMEOUT);
  /* 마지막 방어선 — 구글이 느려도 여기까지는 기다렸다가, 그래도 답이 없을 때만 안내 화면.
     실측상 느릴 때 2.5초쯤 걸리므로 넉넉히 잡는다. 손님 입장에선 로딩 스피너가 도는 상태다. */
  var last = setTimeout(fail, 9000);

  // 파라미터 이름은 반드시 code — c 로 보내면 구글이 400으로 막는다(Code.gs 주석 참고).
  fetch(API + (API.indexOf("?") > -1 ? "&" : "?") +
        "a=go&code=" + encodeURIComponent(code) +
        "&d=" + encodeURIComponent(device) +
        "&r=" + encodeURIComponent(document.referrer || "") +
        "&_=" + new Date().getTime(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      clearTimeout(timer);
      clearTimeout(last);
      if (j && j.ok && j.url) { cache(false, j.url); go(j.url); return; }
      // 시트가 "이 코드는 없다/중지다"라고 답한 경우 — 오래된 캐시로 되살리지 않는다.
      if (j && j.url) go(j.url);
      else fail();
    })
    .catch(function () { clearTimeout(timer); backup(); });
})();
</script>
</body>
</html>
